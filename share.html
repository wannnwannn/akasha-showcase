<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Media - Akasha</title>
    <!-- On charge le nouveau fichier CSS dédié -->
    <link rel="stylesheet" href="/share.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loading" class="loader">Analyse de la source...</div>

    <div id="media-card" class="card" style="display: none;">
        <!-- Colonne Gauche : Image -->
        <div class="poster-container">
            <img id="media-poster" src="" alt="Affiche de l'oeuvre">
            <span id="media-type" class="badge">Média</span>
        </div>
        
        <!-- Colonne Droite : Contenu -->
        <div class="card-content">
            <div class="meta-info">
                <span id="media-year"></span>
            </div>
            <h1 id="media-title">Titre</h1>
            <p id="media-desc" class="description">Aucune description disponible pour cette œuvre.</p>
            
            <a id="open-app-btn" href="#" class="btn-glow">Ouvrir dans Akasha</a>
        </div>
    </div>

    <script>
        // 1. Récupération de l'ID dans l'URL
        const path = window.location.pathname;
        let shareId = null;
        // Si l'URL contient bien "/s/", on coupe la chaîne de texte pour récupérer ce qu'il y a après
        if (path.startsWith('/s/')) {
            shareId = path.split('/s/')[1];
        }

        // Remplace par tes vraies clés Supabase
        const SUPABASE_URL = 'https://ewdtspjgcuvwvjnooytf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3ZHRzcGpnY3V2d3Zqbm9veXRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3MjMxMzgsImV4cCI6MjA5MTI5OTEzOH0.fHTGoA8OFOhk7VusZFgCg7GBn0cgp-UrYeJjV2gxl10';
        if (shareId) {
            // 3. Requête à la base de données
            fetch(`${SUPABASE_URL}/rest/v1/shared_links?id=eq.${shareId}&select=media_data`, {
                headers: {
                    'apikey': SUPABASE_ANON_KEY,
                    'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                }
            })
            .then(res => res.json())
            .then(data => {
                if (data.length > 0) {
                    const media = data[0].media_data;
                    
                    // On cache le loader, on affiche la carte
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('media-card').style.display = 'flex';
                    
                    // HYDRATATION ROBUSTE : On cherche les données peu importe le format de l'API
                    
                    // Titre
                    document.getElementById('media-title').innerText = media.title || media.name || media.title_romaji || 'Titre inconnu';
                    
                    // Image (Couvre tous les cas : Anilist, TMDB, Custom...)
                    const coverUrl = media.cover || media.cover_url || media.image_url || media.poster_path;
                    const posterEl = document.getElementById('media-poster');
                    if(coverUrl) {
                        posterEl.src = coverUrl;
                    } else {
                        posterEl.style.display = 'none'; // Cacher l'encart si pas d'image du tout
                    }

                    // Type (Film, TV, Anime...)
                    if(media.type) {
                        document.getElementById('media-type').innerText = media.type;
                    } else {
                        document.getElementById('media-type').style.display = 'none';
                    }

                    // Année
                    const yearInfo = media.year || media.release_date || media.first_air_date;
                    if(yearInfo) {
                        document.getElementById('media-year').innerText = String(yearInfo).substring(0, 4);
                    }

                    // Description (Couvre Anilist, TMDB, etc.)
                    const desc = media.description || media.synopsis || media.overview;
                    if(desc) {
                        // Supprime les balises HTML potentielles envoyées par l'API (comme Anilist)
                        document.getElementById('media-desc').innerHTML = desc; 
                    }
                    
                    // Le lien de redirection finale
                    document.getElementById('open-app-btn').href = `https://app.akasha.app/?import=${shareId}`;
                } else {
                    document.getElementById('loading').innerText = "Ce lien a expiré ou n'existe pas.";
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('loading').innerText = "Erreur de connexion avec le serveur.";
            });
        } else {
            document.getElementById('loading').innerText = "Lien de partage invalide.";
        }
    </script>
</body>
</html>
